    С недавних пор в целом активно из подручных материалов строю небольшую IoT-среду. Вот вы знали, что из старого телефона получается прекрасный хаб для устройств? А что с помощью Kinect до сих пор можно строить точную карту помещения?

    В идеале хочу закончить превращать свою XiaoZhi-говорилку в настраиваемый переводчик с русского языка на какой-либо другой в реальном времени.

    Кроме компьютеров, я большой фанат музыки: шумной и тихой, нежной и яростной. Люблю собирать интересные факты о тех или иных группах.

    Также пишу музыку самостоятельно, играл на барабанах в нескольких локальных группах, давал концерты. В текущий момент пишем материал.

    Люблю поигрывать и проигрывать в настольный теннис, для меня это легкий способ разрядиться после активной работы.
