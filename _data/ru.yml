  title: Самоопределение
  description: |
    Проводя черту, я имею опыт и способности перекраивать свою жизнь. Думаю, я бы мог остаться в web-разработке, закрепиться как стабильный и серьезный специалист-технический писатель, но мне этого показалось мало. С поступлением в ВУЗ я начал свою жизнь с чистого листа и теперь вряд ли остановлюсь работать, так как вряд ли жалею об этом и уж точно люблю, чем занимаюсь.

    Коммерческая разработка дала мне способности просматривать любой продукт "насквозь", чтобы корректно оценивать его сильные и слабые стороны. Помимо этого, мне теперь также хорошо дается планирование архитектуры проекта, его разработка и внедрение.
    
    В команде я могу как слушать, так и давать весомые комментарии. Если необходимо, спокойно беру на себя менеджмент рабочих процессов. В большинстве случаев о моей работе оставляли положительную обратную связь, вне зависимости от поставленных задач и распределенных на меня обязанностей.

